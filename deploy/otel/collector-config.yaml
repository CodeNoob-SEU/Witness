extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  # The first three policies are deterministic keep rules. The final policy
  # samples only otherwise-unremarkable successful traces.
  #
  # The decision is taken decision_wait after a trace's FIRST span arrives,
  # and a root span only arrives when its execution ends. The application
  # therefore repeats react_agent.execution.kind on every child span; do not
  # write a policy that depends on a root-only attribute. For evidence runs
  # set WITNESS_OTEL_SUCCESS_SAMPLE_PERCENT=100 on the Collector container.
  tail_sampling:
    decision_wait: 5s
    num_traces: 10000
    expected_new_traces_per_sec: 100
    policies:
      - name: keep-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: keep-recovery
        type: string_attribute
        string_attribute:
          key: react_agent.execution.kind
          values: [resume]
      - name: keep-budget-and-loop
        type: string_attribute
        string_attribute:
          key: react_agent.policy.trigger
          values: [budget_exhausted, loop_detected]
      - name: sample-success
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:WITNESS_OTEL_SUCCESS_SAMPLE_PERCENT:-10}
  batch:
    timeout: 2s
    send_batch_size: 512

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:9464
    resource_to_telemetry_conversion:
      enabled: true
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
