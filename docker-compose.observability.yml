name: react-agent-observability

services:
  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: [--config=/etc/otelcol-contrib/config.yaml]
    environment:
      GOMEMLIMIT: 220MiB
      # 10 keeps production cost bounded; 100 keeps every trace of an evidence run.
      WITNESS_OTEL_SUCCESS_SAMPLE_PERCENT: ${WITNESS_OTEL_SUCCESS_SAMPLE_PERCENT:-10}
    volumes:
      - ./deploy/otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:9464:9464"
      - "127.0.0.1:13133:13133"
    depends_on:
      - jaeger
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./deploy/otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - otel-collector
    restart: unless-stopped
