            break;
        }
        updateMetrics(request);
      }

      function normalizeAgentEvent(eventName, payload) {
        if (!isPlainObject(payload)) return null;
        const envelope = isPlainObject(payload.event) ? payload.event : payload;
        const explicitKind = firstDefined(envelope.kind, envelope.event_type, envelope.type);
        const rawKind = firstDefined(explicitKind, eventName);
        if (typeof rawKind !== "string") return null;
        const normalizedKind = rawKind.replace(/[.-]/g, "_");
        if (explicitKind === undefined && !RICH_EVENT_KINDS.has(normalizedKind)) return null;
        const publicData = firstDefined(envelope.public_payload, envelope.data, payload.public_payload, payload.data);
        const hasDurableSequence = Object.prototype.hasOwnProperty.call(envelope, "durable_sequence")
          || Object.prototype.hasOwnProperty.call(payload, "durable_sequence");
        const durableSequence = Object.prototype.hasOwnProperty.call(envelope, "durable_sequence")
          ? envelope.durable_sequence : payload.durable_sequence;
        return {
          ...envelope,
          kind: normalizedKind,
          data: isPlainObject(publicData) ? publicData : {},
          sequence: hasDurableSequence ? durableSequence : firstDefined(envelope.sequence, payload.sequence),
          live_sequence: firstDefined(envelope.live_sequence, payload.live_sequence),
        };
      }
      function applyAuthoritativeAnswer(request, answer) {
        if (typeof answer !== "string" || !answer) return;
        flushNow(request);
        request.answer = answer;
        request.pendingAnswer = "";
        request.assistant.textNode.data = answer;
      }
      function resultSummary(data) {
        const usage = isPlainObject(data.usage) ? data.usage : {};
        const parts = [];
        if (data.model_calls !== undefined) parts.push(`${data.model_calls} 次模型调用`);
        if (data.tool_calls !== undefined) parts.push(`${data.tool_calls} 次工具调用`);
        if (usageTokens(usage)) parts.push(`${usageTokens(usage)} tokens`);
        if (data.committed === false || (data.committed === undefined && data.status && data.status !== "completed")) parts.push("本轮未写入上下文（未提交到会话）");
        else if (data.committed === true) parts.push("已提交到会话");
        if (data.side_effects_possible === true) parts.push("可能已产生工具副作用");
        return parts.join(" · ");
      }
      function handleResult(request, payload) {
        if (!isPlainObject(payload)) return;
        const data = isPlainObject(payload.result) ? payload.result : payload;
        workbench.acceptResult(request, data);
        request.gotResult = true;
        request.result = data;
        if (typeof data.session_id === "string") setSession(data.session_id);
        applyAuthoritativeAnswer(request, data.answer);
        const usage = isPlainObject(data.usage) ? data.usage : null;
        const total = usageTokens(usage);
        if (total) request.totalTokens = total;
        const modelCalls = numberOrNull(data.model_calls);
        const toolCalls = numberOrNull(data.tool_calls);
        if (modelCalls !== null) request.modelCount = modelCalls;
        if (toolCalls !== null) request.toolCount = toolCalls;
        updateMetrics(request);
        const summary = resultSummary(data);
        setMessageMeta(request.assistant, summary);
        const committed = firstDefined(data.committed, data.status === "completed");
        if (!data.answer && data.error) {
          request.assistant.wrapper.classList.add("error");
          request.assistant.textNode.data = String(data.error);
        }
        if (committed === false || data.side_effects_possible === true) {
          addNotice(request, committed === false ? "结果未提交" : "副作用提示", summary || "本轮状态需要人工确认。", "warning");
        }
      }
      function handleStreamError(request, payload) {
        const data = isPlainObject(payload) ? payload : {};
        const message = errorText(data, typeof payload === "string" ? payload : "流式请求失败");
        request.receivedTerminal = true;
        request.assistant.wrapper.classList.remove("streaming");
        if (!request.answer) {
          request.assistant.wrapper.classList.add("error");
          request.assistant.textNode.data = message;
        }
        setMessageMeta(request.assistant, `stream_error · ${message}`);
        addNotice(request, "Stream error", message, "error");
        setBadge(request.runBadge, "stream error", "error");
        setBadge(inspectorState, "error", "error");
        announce(`请求失败：${message}`);
      }
      function handleDone(request, payload) {
        if (isPlainObject(payload) && (
          payload.answer !== undefined || payload.result !== undefined
          || payload.model_calls !== undefined || payload.session_id !== undefined
        )) handleResult(request, payload);
        request.receivedTerminal = true;
        request.assistant.wrapper.classList.remove("streaming");
        if (!request.answer && !request.assistant.textNode.data) request.assistant.textNode.data = "本轮没有返回可显示的文本。";
        if (!request.result) setMessageMeta(request.assistant, "stream completed");
        if (!request.runBadge.classList.contains("error") && !request.runBadge.classList.contains("warning")) {
          setBadge(request.runBadge, "completed", "success");
          setBadge(inspectorState, "completed", "success");
        }
        announce("Agent 已完成回复");
      }

      function handleSseEvent(request, eventName, payload, rawData) {
        if (request.version !== conversationVersion) return;
        const rich = normalizeAgentEvent(eventName, payload);
        if (rich) { handleAgentEvent(request, rich); return; }
        if (eventName === "session") {
          const data = isPlainObject(payload) ? payload : {};
          const nextSessionId = firstDefined(data.session_id, isPlainObject(data.data) ? data.data.session_id : undefined);
          if (typeof nextSessionId === "string") setSession(nextSessionId);
          return;
        }
        if (eventName === "result") { handleResult(request, payload); return; }
        if (eventName === "stream_error") { handleStreamError(request, payload); return; }
        if (eventName === "done" || rawData === "[DONE]") { handleDone(request, payload); }
      }

      function parseEventBlock(block, request) {
        if (!block) return;
        let eventName = "message";
        let eventId = null;
        const dataLines = [];
        const lines = block.split(/\r\n|\n|\r/);
        for (const line of lines) {
          if (!line || line.startsWith(":")) continue;
          const colon = line.indexOf(":");
          const field = colon === -1 ? line : line.slice(0, colon);
          let value = colon === -1 ? "" : line.slice(colon + 1);
          if (value.startsWith(" ")) value = value.slice(1);
          if (field === "event") eventName = value || "message";
          if (field === "id") eventId = value || null;
          if (field === "data") dataLines.push(value);
        }
        if (!dataLines.length) return;
        const rawData = dataLines.join("\n");
        let payload = rawData;
        if (rawData === "[DONE]") payload = {};
        else {
          try { payload = JSON.parse(rawData); } catch (_error) { /* plain text is valid SSE data */ }
        }
        if (eventId !== null && isPlainObject(payload)) {
          const envelope = isPlainObject(payload.event) ? payload.event : payload;
          const kind = String(firstDefined(envelope.kind, envelope.event_type, eventName, "")).replace(/[.-]/g, "_");
          const idField = ["model_text_delta", "model_refusal_delta", "model_tool_call_delta", "model_tool_call_ready"].includes(kind)
            ? "live_sequence" : "sequence";
          if (envelope[idField] === undefined) {
            if (envelope === payload) payload = { ...payload, [idField]: numberOrNull(eventId) ?? eventId };
            else payload = { ...payload, event: { ...envelope, [idField]: numberOrNull(eventId) ?? eventId } };
          }
        }
        handleSseEvent(request, eventName, payload, rawData);
      }

      async function consumeSse(response, request, signal) {
        if (!response.body) throw new Error("浏览器未提供可读取的响应流");
        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";
        try {
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            if (signal.aborted) throw new DOMException("Aborted", "AbortError");
            buffer += decoder.decode(value, { stream: true });
            while (true) {
              const match = /(?:\r\n|\r|\n)(?:\r\n|\r|\n)/.exec(buffer);
              if (!match) break;
              const block = buffer.slice(0, match.index);
              buffer = buffer.slice(match.index + match[0].length);
              parseEventBlock(block, request);
            }
          }
          buffer += decoder.decode();
          if (buffer.trim()) parseEventBlock(buffer, request);
        } finally { reader.releaseLock(); }
      }
      async function readHttpError(response) {
        const raw = await response.text().catch(() => "");
        if (!raw) return `请求失败（HTTP ${response.status}）`;
        try {
          const data = JSON.parse(raw);
          return String(firstDefined(data.detail, data.error, data.message, `请求失败（HTTP ${response.status}）`));
        } catch (_error) { return raw.slice(0, 500); }
      }
      function markDisconnected(request, detail = "") {
        flushNow(request);
        request.assistant.wrapper.classList.remove("streaming");
        const message = "连接在 terminal 事件前关闭；最终状态未知，未自动重试。";
        if (!request.answer) {
          request.assistant.wrapper.classList.add("error");
          request.assistant.textNode.data = message;
        }
        setMessageMeta(request.assistant, `disconnected_unknown${detail ? ` · ${detail}` : ""}`);
        addNotice(request, "Disconnected unknown", `${message}${detail ? `\n${detail}` : ""}`, "warning");
        setBadge(request.runBadge, "unknown", "warning");
        setBadge(inspectorState, "unknown", "warning");
        announce("连接中断，Agent 最终状态未知");
      }
      function markStopped(request) {
        flushNow(request);
        request.assistant.wrapper.classList.remove("streaming");
        if (request.transport === "runtime") {
          if (!request.answer) request.assistant.textNode.data = "已停止关注；Agent 仍在后台运行。";
          setMessageMeta(request.assistant, "follower detached · 后台运行未取消 · 可从 History 重新连接");
          addNotice(request, "Follower detached", "仅关闭了本浏览器订阅，后台 Runtime 不受影响。", "warning");
          setBadge(request.runBadge, "detached", "warning");
          setBadge(inspectorState, "detached", "warning");
          workbench.noteDetached(request);
          announce("已停止关注，后台运行仍继续");
        } else {
          if (!request.answer) request.assistant.textNode.data = "已停止接收本轮输出。";
          setMessageMeta(request.assistant, "用户已停止 · 会话已保留 · 工具副作用状态未知");
          addNotice(request, "Stopped by user", "客户端已中止流。不会自动重试；服务端工具调用可能已经发生。", "warning");
          setBadge(request.runBadge, "stopped", "warning");
          setBadge(inspectorState, "stopped", "warning");
          announce("已停止接收，当前会话已保留");
        }
      }

      async function submitMessage(message) {
        const text = message.trim();
        if (!text || busy) return;
        addMessage("user", text);
        input.value = "";
        input.style.height = "auto";
        requestNumber += 1;
        const assistant = addMessage("assistant", "", "", "streaming");
        const request = makeRequestState(assistant);
        const requestVersion = conversationVersion;
        const controller = new AbortController();
        activeController = controller;
        activeRequest = request;
        setBusy(true);
        setBadge(inspectorState, "connecting", "running");
        let transportError = null;
        try {
          const runtimeHandled = await workbench.startAndFollow(text, request, controller.signal);
          if (runtimeHandled) return;
          request.transport = "legacy";
          const response = await fetch("/api/chat/stream", {
              method: "POST",
              headers: { "Accept": "text/event-stream", "Content-Type": "application/json" },
              body: JSON.stringify({ message: text, session_id: sessionId }),
              signal: controller.signal,
            });
          if (requestVersion !== conversationVersion) return;
          if (!response.ok) {
            const detail = await readHttpError(response);
            if (response.status === 404 && sessionId) {
              setSession(null);
              handleStreamError(request, { message: `会话已失效，已切换为新会话；${detail}` });
              return;
            }
            handleStreamError(request, { message: `${detail}（HTTP ${response.status}）` });
            return;
          }
          await consumeSse(response, request, controller.signal);
        } catch (error) {
          if (requestVersion !== conversationVersion) return;
          if (controller.signal.aborted && request.stoppedByUser) markStopped(request);
          else if (controller.signal.aborted) transportError = "请求已中止";
          else transportError = error instanceof Error ? error.message : "网络错误";
        } finally {
          if (requestVersion !== conversationVersion) return;
          flushNow(request);
          if (!request.receivedTerminal && !request.stoppedByUser) markDisconnected(request, transportError || "");
          if (activeController === controller) activeController = null;
          if (activeRequest === request) activeRequest = null;
          setBusy(false);
          input.focus();
        }
      }

      function resetConversationView() {
        setSession(null);
        chat.querySelectorAll(".message").forEach((node) => node.remove());
        timeline.querySelectorAll(".run-panel").forEach((node) => node.remove());
        empty.hidden = false;
        inspectorEmpty.hidden = false;
        input.value = "";
        input.style.height = "auto";
        requestNumber = 0;
        resetMetrics();
      }

      const workbench = (() => {
        const STORAGE_KEY = "react-agent-workbench:v2";
        const TRANSIENT_KINDS = new Set([
          "model_text_delta", "model_refusal_delta", "model_tool_call_delta",
          "model_tool_call_ready",
        ]);
        const TERMINAL_KINDS = new Set(["run_completed", "run_aborted"]);
        const OMITTED_KEYS = /^(private_payload|checkpoint|reasoning|reasoning_content|provider_state|opaque_provider_state|raw_provider_event|raw_stream_event)$/i;
        const SECRET_KEYS = /(api[_-]?key|authorization|access[_-]?token|refresh[_-]?token|password|credential|client[_-]?secret)/i;
        const tabs = Array.from(document.querySelectorAll(".view-tab"));
        const panels = new Map(tabs.map((tab) => [tab.dataset.view, document.querySelector(`#view-${tab.dataset.view}`)]));

        let selectedView = "live";
        let runtimeAvailable = null;
        let currentRequest = null;
        let currentUserMessage = "";
        let eventLog = [];
        let state = emptyState();
        let replaySequence = 0;
        let knownRuns = [];
        let durableBuffer = createContiguousEventBuffer(0);
        let liveKeys = new Set();
        let detached = false;
        let auditFilter = "";
        let renderFrame = 0;
        let historyLoading = false;

        function emptyUsage() {
          return { input_tokens: 0, output_tokens: 0, total_tokens: 0 };
        }

        function emptyState(runId = null) {
          return {
            runId, sessionId: null, executionId: null, status: "idle", phase: "idle",
            stopReason: null, latestStep: 0, startedAt: null, endedAt: null,
            agentRevision: null, toolManifestHash: null, budget: {},
            models: {}, modelOrder: [], tools: {}, toolOrder: [], usage: emptyUsage(),
            answer: "", authoritativeAnswer: null, reconciliation: [], checkpoints: [],
            workspace: null, costEntries: [], costMicrounits: null, currency: null,
            costUnknownReason: null, durableCursor: 0, liveCursor: 0, gaps: [],
            actionMessage: "", transport: "unknown",
          };
        }

        function sanitize(value, key = "", depth = 0) {
          if (OMITTED_KEYS.test(key)) return undefined;
          if (SECRET_KEYS.test(key)) return "[redacted]";
          if (depth > 10) return "[max depth]";
          if (value === null || typeof value === "boolean" || typeof value === "number") return value;
          if (typeof value === "string") return value.length > 200000 ? `${value.slice(0, 200000)}\n[…truncated…]` : value;
          if (Array.isArray(value)) return value.slice(0, 5000).map((item) => sanitize(item, "", depth + 1));
          if (!isPlainObject(value)) return String(value);
          const result = {};
          Object.entries(value).forEach(([childKey, childValue]) => {
            const safe = sanitize(childValue, childKey, depth + 1);
            if (safe !== undefined) result[childKey] = safe;
          });
          return result;
        }

        function normalizedKind(value) {
          return typeof value === "string" ? value.replace(/[.-]/g, "_") : "unknown";
        }

        function normalizedEvent(request, event) {
          const clean = sanitize(event);
          const kind = normalizedKind(clean.kind);
          const rawSequence = numberOrNull(clean.sequence);
          const rawLiveSequence = numberOrNull(clean.live_sequence);
          const runtime = request?.transport === "runtime";
          const durable = runtime && rawSequence !== null && !TRANSIENT_KINDS.has(kind);
          const streamSequence = !durable && rawSequence !== null ? rawSequence : null;
          return {
            ...clean,
            kind,
            data: isPlainObject(clean.data) ? clean.data : {},
            durable,
            sequence: durable ? rawSequence : null,
            stream_sequence: streamSequence,
            live_sequence: rawLiveSequence ?? streamSequence,
            received_at: new Date().toISOString(),
          };
        }

        function cloneState(previous) {
          return {
            ...previous,
            budget: { ...previous.budget },
            models: { ...previous.models }, modelOrder: [...previous.modelOrder],
            tools: { ...previous.tools }, toolOrder: [...previous.toolOrder],
            usage: { ...previous.usage }, reconciliation: [...previous.reconciliation],
            checkpoints: [...previous.checkpoints], costEntries: [...previous.costEntries],
            gaps: [...previous.gaps],
          };
        }

        function eventValue(event, data, name) {
          return firstDefined(event[name], data[name]);
        }

        function modelStateKey(next, event, data) {
          const step = numberOrNull(eventValue(event, data, "step")) || next.latestStep || 0;
          const attempt = firstDefined(data.attempt, data.model_attempt, event.attempt, 1);
          const callKey = firstDefined(event.call_key, data.call_key);
          if (callKey) return String(callKey);
          const preferred = `step:${step}:attempt:${attempt}`;
          if (next.models[preferred]) return preferred;
          for (let index = next.modelOrder.length - 1; index >= 0; index -= 1) {
            const candidate = next.models[next.modelOrder[index]];
            if (candidate && candidate.step === step && candidate.status === "running") return candidate.key;
          }
          return preferred;
        }

        function toolStateKey(next, event, data) {
          const explicit = firstDefined(event.call_key, data.call_key, event.tool_call_id, data.tool_call_id, data.id);
          if (explicit) return String(explicit);
          const step = numberOrNull(eventValue(event, data, "step")) || next.latestStep || 0;
          const index = firstDefined(data.index, event.index, next.toolOrder.length);
          return `step:${step}:tool:${index}`;
        }

        function ensureModel(next, event, data) {
          const key = modelStateKey(next, event, data);
          if (!next.models[key]) {
            next.models[key] = {
              key, step: numberOrNull(eventValue(event, data, "step")) || next.latestStep || 0,
              attempt: firstDefined(data.attempt, data.model_attempt, 1),
              model: firstDefined(data.model, data.model_name, "model"), status: "running",
              output: "", refusal: "", usage: emptyUsage(), durationMs: null,
              finishReason: null, startedAt: event.occurred_at || event.received_at,
              completedAt: null,
            };
            next.modelOrder.push(key);
          } else next.models[key] = { ...next.models[key], usage: { ...next.models[key].usage } };
          return next.models[key];
        }

        function ensureTool(next, event, data) {
          const key = toolStateKey(next, event, data);
          if (!next.tools[key]) {
            next.tools[key] = {
              key, step: numberOrNull(eventValue(event, data, "step")) || next.latestStep || 0,
              name: firstDefined(event.tool_name, data.tool_name, data.name, "unknown_tool"),
              status: "planned", arguments: firstDefined(data.arguments, data.metadata), result: undefined,
              durationMs: null, isError: false, resumePolicy: firstDefined(data.resume_policy, data.tool_resume_policy),
              startedAt: null, completedAt: null,
            };
            next.toolOrder.push(key);
          } else next.tools[key] = { ...next.tools[key] };
          return next.tools[key];
        }

        function normalizedUsage(value) {
          if (!isPlainObject(value)) return emptyUsage();
          const inputTokens = numberOrNull(firstDefined(value.input_tokens, value.prompt_tokens)) || 0;
          const outputTokens = numberOrNull(firstDefined(value.output_tokens, value.completion_tokens)) || 0;
          return {
            input_tokens: inputTokens,
            output_tokens: outputTokens,
            total_tokens: numberOrNull(firstDefined(value.total_tokens, value.totalTokens)) ?? (inputTokens + outputTokens),
          };
        }

        function finalModelText(data) {
          const direct = firstDefined(data.final_text, data.output_text, data.text, data.answer, data.content);
          if (typeof direct === "string") return direct;
          if (isPlainObject(data.message) && typeof data.message.content === "string") return data.message.content;
          if (isPlainObject(data.output) && typeof data.output.text === "string") return data.output.text;
          return null;
        }

        function recomputeDerived(next) {
          let inputTokens = 0;
          let outputTokens = 0;
          let totalTokens = 0;
          const modelText = [];
          next.modelOrder.forEach((key) => {
            const model = next.models[key];
            inputTokens += model.usage.input_tokens || 0;
            outputTokens += model.usage.output_tokens || 0;
            totalTokens += model.usage.total_tokens || 0;
            if (model.output) modelText.push(model.output);
            if (model.refusal) modelText.push(model.refusal);
          });
          next.usage = { input_tokens: inputTokens, output_tokens: outputTokens, total_tokens: totalTokens };
          next.answer = next.authoritativeAnswer !== null ? next.authoritativeAnswer : modelText.join("");
          return next;
        }

        function costMicrounits(data) {
          const direct = firstDefined(data.amount_microunits, data.cost_microunits, data.total_microunits, data.amount_micros);
          const directNumber = numberOrNull(direct);
          if (directNumber !== null) return directNumber;
          if (isPlainObject(data.cost)) return numberOrNull(firstDefined(data.cost.microunits, data.cost.amount_microunits));
          return null;
        }

        function currencyAmountMicrounits(value) {
          const amount = numberOrNull(value);
          if (amount === null) return null;
          const microunits = Math.round(amount * 1000000);
          return Number.isSafeInteger(microunits) ? microunits : null;
        }

        function adjustmentAmountMicrounits(data) {
          const explicitMicrounits = costMicrounits(data);
          if (explicitMicrounits !== null) return explicitMicrounits;
          const amount = firstDefined(data.amount, isPlainObject(data.cost) ? data.cost.amount : undefined);
          return currencyAmountMicrounits(amount);
        }

        function adjustmentOperationTotalMicrounits(data) {
          const explicitMicrounits = numberOrNull(firstDefined(
            data.operation_total_microunits,
            data.operation_total_micros,
            isPlainObject(data.cost) ? firstDefined(data.cost.operation_total_microunits, data.cost.operation_total_micros) : undefined,
          ));
          if (explicitMicrounits !== null) return explicitMicrounits;
          const total = firstDefined(data.operation_total, isPlainObject(data.cost) ? data.cost.operation_total : undefined);
          return currencyAmountMicrounits(total);
        }

        function summarizeCostEntries(entries) {
          const unresolved = new Map();
          let knownMicrounits = 0;
          let hasKnownAmount = false;

          entries.forEach((entry, index) => {
            const data = entry.data;
            const recordIdValue = firstDefined(data.record_id, `record:${entry.sequence ?? index}`);
            const recordId = String(recordIdValue);

            if (entry.kind === "cost_recorded") {
              if (entry.amount === null) {
                unresolved.set(recordId, String(firstDefined(data.unknown_reason, data.reason, "pricing unavailable")));
              } else {
                knownMicrounits += entry.amount;
                hasKnownAmount = true;
              }
              return;
            }

            const adjustsRecordId = typeof data.adjusts_record_id === "string" && data.adjusts_record_id
              ? data.adjusts_record_id
              : null;
            const amount = adjustmentAmountMicrounits(data);
            const operationTotal = adjustmentOperationTotalMicrounits(data);
            const resolvesUnknown = adjustsRecordId !== null
              && unresolved.has(adjustsRecordId)
              && (amount !== null || operationTotal !== null);

            if (amount !== null) {
              knownMicrounits += amount;
              hasKnownAmount = true;
            } else if (resolvesUnknown && operationTotal !== null) {
              // An unknown predecessor contributed nothing to the total, so its
              // first known operation total is also the ledger contribution.
              knownMicrounits += operationTotal;
              hasKnownAmount = true;
            }
            if (resolvesUnknown) unresolved.delete(adjustsRecordId);
          });

          return {
            microunits: unresolved.size ? null : (hasKnownAmount ? knownMicrounits : null),
            unknownReason: unresolved.size ? unresolved.values().next().value : null,
          };
        }

        function reduce(previous, event) {
          const next = cloneState(previous);
          const data = event.data;
          const step = numberOrNull(eventValue(event, data, "step")) || 0;
          next.latestStep = Math.max(next.latestStep, step);
          next.runId = String(firstDefined(event.run_id, data.run_id, next.runId) || "") || null;
          next.sessionId = String(firstDefined(event.session_id, data.session_id, next.sessionId) || "") || null;
          next.executionId = String(firstDefined(event.execution_id, data.execution_id, next.executionId) || "") || null;
          next.agentRevision = firstDefined(event.agent_revision, data.agent_revision, next.agentRevision);
          next.toolManifestHash = firstDefined(event.tool_manifest_hash, data.tool_manifest_hash, next.toolManifestHash);
          if (event.durable && event.sequence !== null) next.durableCursor = Math.max(next.durableCursor, event.sequence);
          if (event.live_sequence !== null) next.liveCursor = Math.max(next.liveCursor, event.live_sequence);

          switch (event.kind) {
            case "run_started":
              next.status = "running";
              next.phase = "running";
              next.startedAt = event.occurred_at || event.received_at;
              next.budget = isPlainObject(data.budget) ? { ...data.budget } : { ...data };
              break;
            case "run_resumed":
              next.status = "running";
              next.phase = "running";
              next.startedAt = next.startedAt || event.occurred_at || event.received_at;
              break;
            case "model_started": {
              const model = ensureModel(next, event, data);
              model.status = "running";
              model.model = firstDefined(data.model, data.model_name, model.model);
              model.startedAt = event.occurred_at || event.received_at;
              next.phase = "waiting_model";
              break;
            }
            case "model_text_delta": {
              const model = ensureModel(next, event, data);
              const delta = firstDefined(data.delta, data.text, "");
              if (typeof delta === "string") model.output += delta;
              break;
            }
            case "model_refusal_delta": {
              const model = ensureModel(next, event, data);
              const delta = firstDefined(data.delta, data.text, "");
              if (typeof delta === "string") model.refusal += delta;
              break;
            }
            case "model_completed": {
              const model = ensureModel(next, event, data);
              const finalText = finalModelText(data);
              if (finalText !== null) model.output = finalText;
              model.usage = normalizedUsage(firstDefined(data.usage, event.usage_delta));
              model.durationMs = numberOrNull(firstDefined(data.duration_ms, data.duration));
              model.finishReason = firstDefined(data.finish_reason, data.outcome, data.status, "completed");
              model.status = "completed";
              model.completedAt = event.occurred_at || event.received_at;
              next.phase = "running";
              break;
            }
            case "model_failed": {
              const model = ensureModel(next, event, data);
              model.status = "failed";
              model.error = errorText(data, "model failed");
              model.completedAt = event.occurred_at || event.received_at;
              next.phase = "running";
              break;
            }
            case "model_tool_call_delta":
            case "model_tool_call_ready":
            case "tool_planned": {
              const tool = ensureTool(next, event, data);
              tool.status = event.kind === "model_tool_call_delta" ? "arguments" : "planned";
              if (data.arguments !== undefined) tool.arguments = data.arguments;
              break;
            }
            case "tool_started":
            case "tool_claimed": {
              const tool = ensureTool(next, event, data);
              tool.status = "running";
              tool.startedAt = event.occurred_at || event.received_at;
              tool.arguments = firstDefined(data.arguments, data.metadata, tool.arguments);
              next.phase = "waiting_tool";
              break;
            }
            case "tool_result":
            case "tool_completed": {
              const tool = ensureTool(next, event, data);
              tool.status = data.is_error === true || data.status === "error" ? "failed" : "completed";
              tool.isError = tool.status === "failed";
              tool.result = firstDefined(data.result, data.metadata);
              tool.durationMs = numberOrNull(firstDefined(data.duration_ms, data.duration));
              tool.completedAt = event.occurred_at || event.received_at;
              next.phase = "running";
              break;
            }
            case "tool_reused": {
              const tool = ensureTool(next, event, data);
              tool.status = "reused";
              tool.result = firstDefined(data.result, data.metadata);
              tool.completedAt = event.occurred_at || event.received_at;
              next.phase = "running";
              break;
            }
            case "reconciliation_required": {
              const tool = ensureTool(next, event, data);
              tool.status = "needs_reconciliation";
              const item = { callKey: tool.key, toolName: tool.name, reason: errorText(data, "外部副作用状态不确定") };
              next.reconciliation = next.reconciliation.filter((entry) => entry.callKey !== tool.key);
              next.reconciliation.push(item);
              next.status = "needs_reconciliation";
              next.phase = "needs_reconciliation";
              break;
            }
            case "checkpoint":
            case "workspace_checkpoint":
            case "workspace_checkpointed": {
              const checkpoint = {
                sequence: event.sequence, safe: event.safe_checkpoint === true || data.safe_checkpoint === true,
                tree: firstDefined(data.tree_id, data.workspace_tree, data.git_tree, data.tree),
                baseline: firstDefined(data.baseline_revision, data.baseline, data.base_revision),
                diff: firstDefined(data.diff, data.diff_summary, data.patch),
                status: firstDefined(data.workspace_status, data.status, "checkpointed"), data,
              };
              next.checkpoints.push(checkpoint);
              next.workspace = checkpoint;
              break;
            }
            case "workspace_diverged":
              next.workspace = { ...(next.workspace || {}), status: "diverged", data, diff: firstDefined(data.diff, data.diff_summary) };
              next.status = "workspace_diverged";
              break;
            case "budget_exhausted":
              next.status = "budget_exhausted";
              next.stopReason = firstDefined(data.reason, "budget_exhausted");
              break;
            case "loop_detected":
              next.status = "loop_detected";
              next.stopReason = "loop_detected";
              break;
            case "cost_recorded":
            case "cost_adjusted": {
              const amount = costMicrounits(data);
              next.costEntries.push({ kind: event.kind, sequence: event.sequence, amount, data });
              const costSummary = summarizeCostEntries(next.costEntries);
              next.costMicrounits = costSummary.microunits;
              next.costUnknownReason = costSummary.unknownReason;
              next.currency = firstDefined(data.currency, next.currency, "USD");
              break;
            }
            case "run_completed": {
              next.status = String(firstDefined(data.status, data.outcome, "completed"));
              next.phase = "terminal";
              next.stopReason = firstDefined(data.stop_reason, data.reason);
              next.endedAt = event.occurred_at || event.received_at;
              const answer = firstDefined(data.answer, data.final_answer);
              if (typeof answer === "string") next.authoritativeAnswer = answer;
              const runUsage = isPlainObject(data.usage) ? normalizedUsage(data.usage) : null;
              if (runUsage) next.usage = runUsage;
              break;
            }
            case "run_aborted":
              next.status = String(firstDefined(data.status, "aborted"));
              next.phase = "terminal";
              next.stopReason = firstDefined(data.stop_reason, data.reason, data.error);
              next.endedAt = event.occurred_at || event.received_at;
              break;
            default:
              break;
          }
          const derived = recomputeDerived(next);
          if (event.kind === "run_completed" && isPlainObject(data.usage)) derived.usage = normalizedUsage(data.usage);
          return derived;
        }

        function fold(events, throughSequence = Infinity) {
          return events.reduce((snapshot, event) => {
            if (event.durable && event.sequence > throughSequence) return snapshot;
            return reduce(snapshot, event);
          }, emptyState(state.runId));
        }

        function startStateForRequest(request, message = "") {
          currentRequest = request;
          currentUserMessage = message;
          eventLog = [];
          state = emptyState();
          state.transport = request.transport || "unknown";
          durableBuffer = createContiguousEventBuffer(0);
          liveKeys = new Set();
          replaySequence = 0;
          detached = false;
          scheduleRender();
        }

        function updateRunUi(request, runId) {
          if (!runId) return;
          request.runId = String(runId);
          request.runIdNode.textContent = shortId(runId);
          request.runIdNode.title = String(runId);
          runValue.textContent = shortId(runId);
          runValue.title = String(runId);
          state.runId = String(runId);
        }

        function rememberCurrentRun() {
          if (!state.runId) return;
          const existing = knownRuns.find((run) => run.run_id === state.runId) || {};
          const record = {
            ...existing, run_id: state.runId, session_id: state.sessionId || sessionId,
            status: state.status, step: state.latestStep, tokens: state.usage.total_tokens,
            cursor: state.durableCursor, updated_at: new Date().toISOString(),
            cost_microunits: state.costMicrounits, currency: state.currency,
            cost_unknown_reason: state.costUnknownReason,
            message: currentUserMessage || existing.message || "",
          };
          knownRuns = [record, ...knownRuns.filter((run) => run.run_id !== state.runId)].slice(0, 100);
        }

        function acceptEvent(request, event) {
          if (request !== currentRequest) startStateForRequest(request);
          const normalized = normalizedEvent(request, event);
          if (!normalized.durable && normalized.live_sequence !== null) {
            const key = `${normalized.kind}:${normalized.live_sequence}`;
            if (liveKeys.has(key)) return [];
            liveKeys.add(key);
          }

          const delivery = durableBuffer.accept(normalized);
          if (delivery.invalid) {
            state.actionMessage = "收到无效的 durable sequence，事件已安全忽略。";
            scheduleRender();
            return [];
          }
          if (delivery.gap && !state.gaps.some((gap) => (
            gap.after === delivery.gap.after && gap.before === delivery.gap.before
          ))) {
            state.gaps.push(delivery.gap);
          }

          delivery.ready.forEach((accepted) => {
            const eventRunId = firstDefined(accepted.run_id, accepted.data.run_id, request.runId);
            if (eventRunId) updateRunUi(request, eventRunId);
            eventLog.push(accepted);
            state = reduce(state, accepted);
            state.transport = request.transport || state.transport;
            if (state.sessionId) setSession(state.sessionId);
            replaySequence = Math.max(replaySequence, state.durableCursor);
            if (["model_completed", "run_completed", "run_aborted"].includes(accepted.kind) && state.answer) {
              flushNow(request);
              request.answer = state.answer;
              request.pendingAnswer = "";
              request.assistant.textNode.data = state.answer;
            }
          });
          if (delivery.ready.length || delivery.gap) {
            rememberCurrentRun();
            persist();
            scheduleRender();
          }
          return delivery.ready;
        }

        function acceptResult(request, data) {
          if (request !== currentRequest) return;
          const runId = firstDefined(data.run_id, request.runId);
          if (runId) updateRunUi(request, runId);
          if (typeof data.session_id === "string") {
            state.sessionId = data.session_id;
            setSession(data.session_id);
          }
          if (typeof data.answer === "string") {
            state.authoritativeAnswer = data.answer;
            state.answer = data.answer;
          }
          if (data.status) state.status = String(data.status);
          if (TERMINAL_KINDS.has(normalizedKind(data.kind)) || data.committed !== undefined) state.phase = "terminal";
          if (isPlainObject(data.usage)) state.usage = normalizedUsage(data.usage);
          rememberCurrentRun();
          persist();
          scheduleRender();
        }

        function formatCostAmount(microunits, currency = "USD") {
          if (microunits === null || microunits === undefined) return "成本不可用";
          const amount = microunits / 1000000;
          try {
            return new Intl.NumberFormat("zh-CN", { style: "currency", currency, minimumFractionDigits: 4, maximumFractionDigits: 6 }).format(amount);
          } catch (_error) { return `${amount.toFixed(6)} ${currency}`; }
        }

        function formatCostEvent(data) {
          const amount = costMicrounits(data);
          const label = formatCostAmount(amount, String(firstDefined(data.currency, "USD")));
          const details = [label];
          if (data.pricing_catalog_version) details.push(`catalog ${data.pricing_catalog_version}`);
          if (data.estimated === true) details.push("estimated");

        function safePayload() {
          const storedEvents = eventLog.filter((event) => event.durable || (!TRANSIENT_KINDS.has(event.kind) && state.transport !== "runtime")).slice(-2000).map((event) => sanitize(event));
          return {
            version: 2, selectedView, sessionId, currentRunId: state.runId,
            durableCursor: state.durableCursor, replaySequence, currentUserMessage,
            transport: state.transport, events: storedEvents, knownRuns: knownRuns.slice(0, 100),
            finalAnswer: state.answer, status: state.status, usage: state.usage,
          };
        }

        function persist() {
          try { sessionStorage.setItem(STORAGE_KEY, JSON.stringify(safePayload())); } catch (_error) { /* Workbench remains usable without storage. */ }
        }

        function parseResponsePayload(value) {
          if (Array.isArray(value)) return { events: value };
          if (!isPlainObject(value)) return {};
          return value;
        }

        function responseEvents(payload) {
          const direct = firstDefined(payload.events, payload.items, payload.run_events);
          if (Array.isArray(direct)) return direct;
          if (isPlainObject(payload.data) && Array.isArray(payload.data.events)) return payload.data.events;
          return [];
        }

        function applyResponsePayload(request, payload) {
          const parsed = parseResponsePayload(payload);
          responseEvents(parsed).forEach((rawEvent) => {
            const rich = normalizeAgentEvent("agent_event", rawEvent);
            if (rich) handleAgentEvent(request, rich);
          });
          const run = isPlainObject(parsed.run) ? parsed.run : parsed;
          const snapshot = isPlainObject(run.snapshot) ? run.snapshot : (isPlainObject(parsed.snapshot) ? parsed.snapshot : run);
          const runId = firstDefined(run.run_id, run.id, parsed.run_id, snapshot.run_id);
          if (runId) updateRunUi(request, runId);
          const nextSession = firstDefined(run.session_id, parsed.session_id, snapshot.session_id);
          if (typeof nextSession === "string") { state.sessionId = nextSession; setSession(nextSession); }
          const status = firstDefined(run.status, snapshot.status, snapshot.phase);
          const terminalStatus = ["completed", "aborted", "failed", "cancelled", "canceled"].includes(String(status));
          const snapshotLastSequence = numberOrNull(firstDefined(
            run.last_sequence, snapshot.last_sequence, parsed.last_sequence,
          ));
          const hasUnseenDurable = snapshotLastSequence !== null && snapshotLastSequence > state.durableCursor;
          if (status && (!terminalStatus || !hasUnseenDurable)) state.status = String(status);
          if (terminalStatus && !hasUnseenDurable) {
            state.phase = "terminal";
            request.receivedTerminal = true;
          }
          const result = isPlainObject(parsed.result) ? parsed.result : null;
          if (result) handleResult(request, result);
          const snapshotAnswer = firstDefined(snapshot.answer, snapshot.output, snapshot.final_answer);
          if (!hasUnseenDurable && typeof snapshotAnswer === "string") {
            state.authoritativeAnswer = snapshotAnswer;
            state.answer = snapshotAnswer;
            request.answer = snapshotAnswer;
            request.assistant.textNode.data = snapshotAnswer;
          }
          if (!hasUnseenDurable && isPlainObject(snapshot.usage)) state.usage = normalizedUsage(snapshot.usage);
          if (Array.isArray(snapshot.costs)) {
            state.costEntries = snapshot.costs.filter(isPlainObject).map((data) => ({
              kind: data.kind === "adjustment" || data.adjusts_record_id ? "cost_adjusted" : "cost_recorded",
              sequence: null,
              ledgerSequence: numberOrNull(data.ledger_sequence),
              amount: costMicrounits(data),
              data,
            }));
            const summary = summarizeCostEntries(state.costEntries);
            state.costMicrounits = Object.hasOwn(snapshot, "cost_microunits")
              ? numberOrNull(snapshot.cost_microunits) : summary.microunits;
            state.costUnknownReason = firstDefined(snapshot.cost_unknown_reason, summary.unknownReason);
            state.currency = firstDefined(snapshot.currency, state.costEntries[0]?.data?.currency, state.currency);
          }
          rememberCurrentRun();
          persist();
          scheduleRender();
          return runId ? String(runId) : null;
        }

        async function consumeRuntimeResponse(response, request, signal) {
          const contentType = response.headers.get("content-type") || "";
          if (contentType.includes("text/event-stream")) {
            await consumeSse(response, request, signal);
            return null;
          }
          const textBody = await response.text();
          if (!textBody) return null;
          let payload;
          try { payload = JSON.parse(textBody); } catch (_error) { throw new Error("Runtime 返回了无法解析的响应"); }
          return applyResponsePayload(request, payload);
        }

        function abortableDelay(ms, signal) {
          return new Promise((resolve, reject) => {
            const timer = window.setTimeout(resolve, ms);
            signal.addEventListener("abort", () => {
              window.clearTimeout(timer);
              reject(new DOMException("Aborted", "AbortError"));
            }, { once: true });
          });
        }

        async function readRunSnapshot(runId, request, signal) {
          const response = await fetch(`/api/runs/${encodeURIComponent(runId)}`, { headers: { "Accept": "application/json" }, signal });
          if (!response.ok) return false;
          const payload = await response.json();
          applyResponsePayload(request, payload);
          return true;
        }

        async function followRun(runId, request, signal, { initialAfter = null, live = true } = {}) {
          let reconnectAttempt = 0;
          let first = true;
          while (!signal.aborted && request.version === conversationVersion && !request.receivedTerminal) {
            const cursor = first && initialAfter !== null ? initialAfter : state.durableCursor;
            const params = new URLSearchParams({ after_sequence: String(Math.max(0, cursor)), follow: String(live) });
            const headers = { "Accept": "text/event-stream" };
            if (cursor > 0) headers["Last-Event-ID"] = String(cursor);
            const response = await fetch(`/api/runs/${encodeURIComponent(runId)}/events?${params}`, { headers, signal });
            if (!response.ok) throw new Error(`${await readHttpError(response)}（events HTTP ${response.status}）`);
            connection.textContent = `Runtime · durable #${state.durableCursor}`;
            await consumeRuntimeResponse(response, request, signal);
            if (request.receivedTerminal) break;
            if (durableBuffer.bufferedCount > 0) {
              reconnectAttempt += 1;
              connection.textContent = `补齐 durable 缺口 · ${reconnectAttempt}`;
              first = false;
              await abortableDelay(Math.min(1000, 100 * reconnectAttempt), signal);
              continue;
            }
            if (!live) break;
            await readRunSnapshot(runId, request, signal).catch(() => false);
            if (request.receivedTerminal) break;
            reconnectAttempt += 1;
            connection.textContent = `重连 follower · ${reconnectAttempt}`;
            await abortableDelay(Math.min(5000, 350 * (2 ** Math.min(reconnectAttempt, 4))), signal);
            first = false;
          }
        }

        async function startAndFollow(message, request, signal) {
          request.transport = "probing";
          startStateForRequest(request, message);
          if (runtimeAvailable === false) return false;
          const idempotencyKey = globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`;
          const response = await fetch("/api/runs", {
            method: "POST",
            headers: { "Accept": "application/json, text/event-stream", "Content-Type": "application/json", "Idempotency-Key": idempotencyKey },
            body: JSON.stringify({ message, session_id: sessionId }),
            signal,
          });
          if ([404, 405, 501].includes(response.status)) {
            runtimeAvailable = false;
            request.transport = "legacy";
            state.transport = "legacy";
            connection.textContent = "兼容模式 · /api/chat/stream";
            scheduleRender();
            return false;
          }
          if (!response.ok) throw new Error(`${await readHttpError(response)}（POST /api/runs HTTP ${response.status}）`);
          runtimeAvailable = true;
          request.transport = "runtime";
          state.transport = "runtime";
          let runId = response.headers.get("x-run-id");
          const location = response.headers.get("location");
          if (!runId && location) runId = decodeURIComponent(location.split("/").filter(Boolean).pop() || "");
          const parsedRunId = await consumeRuntimeResponse(response, request, signal);
          runId = parsedRunId || runId || request.runId;
          if (!runId) throw new Error("Runtime 未返回 run_id，无法订阅事件日志");
          updateRunUi(request, runId);
          connection.textContent = `Runtime · ${shortId(runId)}`;
          rememberCurrentRun();
          persist();
          if (!request.receivedTerminal) await followRun(runId, request, signal);
          return true;
        }

        async function postWithFallback(paths, body) {
          let lastResponse = null;
          for (const path of paths) {
            const response = await fetch(path, {
              method: "POST",
              headers: { "Accept": "application/json", "Content-Type": "application/json", "Idempotency-Key": globalThis.crypto?.randomUUID?.() || String(Date.now()) },
              body: JSON.stringify(body),
            });
            lastResponse = response;
            if (![404, 405].includes(response.status)) return response;
          }
          return lastResponse;
        }

        async function postAction(action, callKey = null, result = undefined) {
          if (!state.runId) return;
          state.actionMessage = `正在提交 ${action}…`;
          scheduleRender();
          const encoded = encodeURIComponent(state.runId);
          try {
            const actionPaths = callKey
              ? [`/api/runs/${encoded}/resolve`, `/api/runs/${encoded}/actions`, `/api/runs/${encoded}/${encodeURIComponent(action)}`]
              : [`/api/runs/${encoded}/${action === "abort" ? "cancel" : encodeURIComponent(action)}`, `/api/runs/${encoded}/actions`];
            const body = callKey ? { action, call_key: callKey } : (action === "cancel" || action === "abort" ? { reason: "user_requested" } : {});
            if (callKey && result !== undefined) body.result = result;
            const response = await postWithFallback(
              actionPaths,
              body,
            );
            if (!response || !response.ok) throw new Error(response ? await readHttpError(response) : "操作接口不可用");
            const payload = await response.json().catch(() => ({}));
            applyResponsePayload(currentRequest, payload);
            state.actionMessage = `${action} 已提交；重新连接 durable journal。`;
            if (currentRequest && !["aborted", "cancelled", "canceled"].includes(state.status)) {
              currentRequest.receivedTerminal = false;
              detached = false;
              const controller = new AbortController();
              activeController = controller;
              activeRequest = currentRequest;
              void followRun(state.runId, currentRequest, controller.signal).finally(() => {
                if (activeController === controller) activeController = null;
              });
            }
          } catch (error) {
            state.actionMessage = `${action} 失败：${error instanceof Error ? error.message : error}`;
          }
          persist();
          scheduleRender();
        }

        async function forkRun(sequence) {
          if (!state.runId) return;
          const safe = state.checkpoints.some((checkpoint) => checkpoint.safe && checkpoint.sequence === sequence);
          if (!safe) {
            state.actionMessage = `sequence #${sequence} 不是安全检查点，Fork 已拒绝。`;
            switchView("live");
            return;
          }
          const response = await postWithFallback(
            [`/api/runs/${encodeURIComponent(state.runId)}/fork`],
            { from_sequence: sequence },
          );
          if (!response || !response.ok) {
            state.actionMessage = `Fork 失败：${response ? await readHttpError(response) : "接口不可用"}`;
            switchView("live");
            return;
          }
          const payload = await response.json().catch(() => ({}));
          const nextRunId = firstDefined(payload.run_id, isPlainObject(payload.run) ? payload.run.run_id : undefined);
          if (nextRunId) await openRun(String(nextRunId), { message: `Fork from ${state.runId} #${sequence}` });
        }

        function mergeRuns(items) {
          const normalized = items.filter(isPlainObject).map((item) => {
            const snapshot = isPlainObject(item.snapshot) ? item.snapshot : {};
            return {
              ...item,
              run_id: String(firstDefined(item.run_id, item.id, snapshot.run_id, "")),
              status: String(firstDefined(item.status, snapshot.status, "unknown")),
              step: firstDefined(item.step, snapshot.step, snapshot.latest_step),
              tokens: firstDefined(item.tokens, item.total_tokens, isPlainObject(snapshot.usage) ? snapshot.usage.total_tokens : undefined),
              cursor: firstDefined(item.sequence, item.last_sequence, snapshot.sequence, snapshot.last_sequence, 0),
              cost_microunits: firstDefined(item.cost_microunits, item.total_cost_microunits, snapshot.cost_microunits),
              currency: firstDefined(item.currency, snapshot.currency),
              cost_unknown_reason: firstDefined(item.cost_unknown_reason, snapshot.cost_unknown_reason),
              message: firstDefined(item.message, item.input, snapshot.message, ""),
            };
          }).filter((item) => item.run_id);
          const merged = new Map(knownRuns.map((item) => [item.run_id, item]));
          normalized.forEach((item) => merged.set(item.run_id, { ...merged.get(item.run_id), ...item }));
          knownRuns = Array.from(merged.values()).sort((a, b) => String(b.updated_at || b.created_at || "").localeCompare(String(a.updated_at || a.created_at || ""))).slice(0, 100);
          persist();
        }

        async function refreshHistory() {
          if (historyLoading || !sessionId || runtimeAvailable === false) { renderHistory(); return; }
          historyLoading = true;
          renderHistory();
          try {
            const response = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}/runs`, { headers: { "Accept": "application/json" } });
            if ([404, 405, 501].includes(response.status)) { runtimeAvailable = false; return; }
            if (!response.ok) throw new Error(await readHttpError(response));
            const payload = await response.json();
            const items = Array.isArray(payload) ? payload : firstDefined(payload.runs, payload.items, []);
            if (Array.isArray(items)) mergeRuns(items);
          } catch (error) {
            state.actionMessage = `History 刷新失败：${error instanceof Error ? error.message : error}`;
          } finally {
            historyLoading = false;
            renderHistory();
          }
        }

        async function openRun(runId, record = {}) {
          conversationVersion += 1;
          activeController?.abort();
          activeController = null;
          activeRequest = null;
          resetConversationView();
          if (record.session_id) setSession(record.session_id);
          currentUserMessage = record.message || `历史 Run ${shortId(runId)}`;
          addMessage("user", currentUserMessage);
          requestNumber = 1;
          const assistant = addMessage("assistant", "", "从 durable journal 重建", "streaming");
          const request = makeRequestState(assistant);
          request.transport = "runtime";
          currentRequest = request;
          startStateForRequest(request, currentUserMessage);
          updateRunUi(request, runId);
          state.transport = "runtime";
          runtimeAvailable = true;
          const controller = new AbortController();
          activeController = controller;
          activeRequest = request;
          setBusy(true);
          try {
            await followRun(runId, request, controller.signal, { initialAfter: 0, live: false });
            await readRunSnapshot(runId, request, controller.signal).catch(() => false);
            if (!request.receivedTerminal) await followRun(runId, request, controller.signal);
          } catch (error) {
            if (!controller.signal.aborted) handleStreamError(request, { message: error instanceof Error ? error.message : String(error) });
          } finally {
            if (activeController === controller) activeController = null;
            if (activeRequest === request) activeRequest = null;
            setBusy(false);
            request.assistant.wrapper.classList.remove("streaming");
            persist();
          }
        }

        function noteDetached(request) {
          if (request === currentRequest) {
            detached = true;
            persist();
            scheduleRender();
          }
        }

        function reset() {
          currentRequest = null;
          currentUserMessage = "";
          eventLog = [];
          state = emptyState();
          replaySequence = 0;
          durableBuffer = createContiguousEventBuffer(0);
          liveKeys = new Set();
          detached = false;
          persist();
          scheduleRender();
        }

        function restore() {
          let stored = null;
          try { stored = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || "null"); } catch (_error) { stored = null; }
          if (!isPlainObject(stored) || stored.version !== 2) {
            switchView("live");
            return;
          }
          knownRuns = Array.isArray(stored.knownRuns) ? stored.knownRuns.filter(isPlainObject).slice(0, 100) : [];
          selectedView = panels.has(stored.selectedView) ? stored.selectedView : "live";
          replaySequence = numberOrNull(stored.replaySequence) || 0;
          if (typeof stored.sessionId === "string") setSession(stored.sessionId);
          if (!stored.currentRunId) {
            switchView(selectedView);
            return;
          }
          currentUserMessage = typeof stored.currentUserMessage === "string" ? stored.currentUserMessage : `恢复 Run ${shortId(stored.currentRunId)}`;
          addMessage("user", currentUserMessage);
          requestNumber = 1;
          const assistant = addMessage("assistant", "", "从 sessionStorage 恢复游标", "streaming");
          const request = makeRequestState(assistant);
          request.transport = stored.transport === "legacy" ? "legacy" : "runtime";
          startStateForRequest(request, currentUserMessage);
          updateRunUi(request, stored.currentRunId);
          const cachedEvents = Array.isArray(stored.events) ? stored.events : [];
          cachedEvents.forEach((cached) => {
            const rich = normalizeAgentEvent("agent_event", cached);
            if (rich) handleAgentEvent(request, rich);
          });
          if (typeof stored.finalAnswer === "string" && stored.finalAnswer) {
            state.authoritativeAnswer = stored.finalAnswer;
            state.answer = stored.finalAnswer;
            request.answer = stored.finalAnswer;
            request.assistant.textNode.data = stored.finalAnswer;
          }
          if (typeof stored.status === "string") state.status = stored.status;
          if (isPlainObject(stored.usage)) state.usage = normalizedUsage(stored.usage);
          replaySequence = Math.min(numberOrNull(stored.replaySequence) || state.durableCursor, state.durableCursor || Number.MAX_SAFE_INTEGER);
          switchView(selectedView);
          if (request.transport === "runtime" && !request.receivedTerminal) {
            runtimeAvailable = true;
            const controller = new AbortController();
            activeController = controller;
            activeRequest = request;
            setBusy(true);
            void followRun(stored.currentRunId, request, controller.signal, { initialAfter: state.durableCursor }).catch((error) => {
              if (!controller.signal.aborted) {
                detached = true;
                state.actionMessage = `自动重连失败：${error instanceof Error ? error.message : error}`;
              }
            }).finally(() => {
              if (activeController === controller) activeController = null;
              if (activeRequest === request) activeRequest = null;
              setBusy(false);
              request.assistant.wrapper.classList.remove("streaming");
              scheduleRender();
            });
          } else request.assistant.wrapper.classList.remove("streaming");
        }

        function usesRuntime() { return runtimeAvailable === true || state.transport === "runtime"; }

        return {
          acceptEvent, acceptResult, startAndFollow, noteDetached, reset, restore,
          usesRuntime, formatCostEvent,
        };
      })();

      form.addEventListener("submit", (event) => { event.preventDefault(); void submitMessage(input.value); });
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); void submitMessage(input.value); }
      });
      input.addEventListener("input", () => {
        input.style.height = "auto";
        input.style.height = `${Math.min(input.scrollHeight, 160)}px`;
      });
      document.querySelectorAll(".suggestion").forEach((button) => {
        button.addEventListener("click", () => void submitMessage(button.textContent || ""));
      });
      stop.addEventListener("click", () => {
        if (!activeController || !activeRequest) return;
        activeRequest.stoppedByUser = true;
        activeController.abort();
      });
      clear.addEventListener("click", () => {
        const oldSessionId = sessionId;
        conversationVersion += 1;
        if (activeRequest?.rafId) window.cancelAnimationFrame(activeRequest.rafId);
        activeController?.abort();
        activeController = null;
        activeRequest = null;
        resetConversationView();
        workbench.reset();
        setBusy(false);
        input.focus();
        if (oldSessionId && !workbench.usesRuntime()) void fetch(`/api/sessions/${encodeURIComponent(oldSessionId)}`, { method: "DELETE" }).catch(() => {});
      });

      fetch("/api/health")
        .then((response) => {
          if (!response.ok) throw new Error("未配置");
          return response.json();
        })
        .then((data) => { connection.textContent = `${data.model || "model"} · ${data.api_mode || "API"}`; })
        .catch(() => { connection.textContent = "Agent 未连接"; connection.style.color = "#9a3d35"; });

      workbench.restore();
      input.focus();
    </script>
  </body>
</html>
