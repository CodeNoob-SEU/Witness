<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Witness — Agent Runtime Console</title>
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/shell.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
  </head>
  <body>
    <div class="app">
      <nav class="rail" aria-label="Sections">
        <div class="rail-mark" aria-hidden="true">W</div>

        <a class="rail-link" href="#/tasks" data-section="tasks">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 5h10M9 12h10M9 19h10" />
            <path d="M4 5.5l1 1 2-2M4 12.5l1 1 2-2M4 19.5l1 1 2-2" />
          </svg>
          Tasks
        </a>

        <a class="rail-link" href="#/runs" data-section="runs">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <path d="M3 9h18M8 4v16" />
          </svg>
          Runs
        </a>

        <a class="rail-link" href="#/recovery" data-section="recovery">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 3-6.7" />
            <path d="M3 4v5h5" />
            <path d="M12 8v4l3 2" />
          </svg>
          Recovery
        </a>

        <a class="rail-link" href="#/evals" data-section="evals">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 19V9M10 19V5M16 19v-7M22 19H2" />
          </svg>
          Evals
        </a>

        <div class="rail-spacer"></div>

        <button class="rail-link" id="theme-toggle" type="button" title="Toggle theme">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
          </svg>
          Theme
        </button>

        <a class="rail-link" href="#/settings" data-section="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H2a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 7.9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V2a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H22a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z" />
          </svg>
          Config
        </a>
      </nav>

      <div class="main">
        <header class="topbar">
          <div class="topbar-title">
            <strong>Witness</strong>
            <span class="faint topbar-tagline" style="font-size: 11.5px">evidence-driven agent runtime</span>
          </div>
          <div class="grow"></div>
          <div class="repo-chip" id="repo-chip"></div>
          <span class="kbd-hint" title="Press ? for shortcuts">?</span>
        </header>

        <main class="view" id="outlet"></main>
      </div>
    </div>

    <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="/assets/js/main.js"></script>
  </body>
</html>
